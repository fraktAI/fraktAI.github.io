name: Publikacja strony

# Uruchamia się: (1) automatycznie: śmieci 4 razy na dobę, prąd co godzinę, (2) po każdej zmianie w repozytorium,
# (3) ręcznie: zakładka Actions -> "Publikacja strony" -> Run workflow.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"   # śmieci + prąd, godziny w UTC
    - cron: "7 * * * *"            # co godzinę: tylko prąd
  workflow_dispatch:
    inputs:
      test_push:
        description: "Wyślij testowe powiadomienie push (do osób z tagiem imgw=1)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["**/README.md"]

permissions:
  contents: write      # zapis zaktualizowanych danych do repozytorium
  pages: write         # publikacja strony
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kruszyn   # pliki aplikacji leżą w folderze "kruszyn" w repozytorium
    outputs:
      scrape: ${{ steps.scrape.outcome }}
      prad: ${{ steps.prad.outcome }}
      imgw: ${{ steps.imgw.outcome }}
      intencje: ${{ steps.intencje.outcome }}
      znicz: ${{ steps.znicz.outcome }}
      wydarzenia: ${{ steps.wydarzenia.outcome }}
      powiadomienia: ${{ steps.powiadomienia.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź, czy wszystkie pliki są w repozytorium
        run: |
          brak=0
          for f in index.html wies.json favicon.svg manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png icon-maskable-512.png push/OneSignalSDKWorker.js data/waste.json scripts/kruszyn_scraper.py scripts/make_ics.py scripts/tauron_outages.py scripts/imgw_warnings.py scripts/kruszyn_intencje.py scripts/znicz_mecze.py scripts/wydarzenia.py scripts/powiadomienia.py; do
            if [ ! -f "$f" ]; then echo "::error::Brakuje pliku w repozytorium: $f (dodaj go: Add file -> Upload files / Create new file)"; brak=1; fi
          done
          exit $brak

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz terminy wywozu z com-d.pl
        id: scrape
        if: github.event.schedule != '7 * * * *'   # godzinny przebieg pomija com-d
        continue-on-error: true   # gdy się nie uda, strona i tak działa na starych danych
        run: python scripts/kruszyn_scraper.py --out data/waste.json --embed index.html

      - name: Pobierz wyłączenia prądu z Tauron
        id: prad
        continue-on-error: true   # gdy się nie uda, zostaje poprzedni plik
        run: python scripts/tauron_outages.py

      - name: Pobierz ostrzeżenia IMGW
        id: imgw
        continue-on-error: true   # gdy się nie uda, zostaje poprzedni plik
        run: python scripts/imgw_warnings.py

      - name: Pobierz intencje mszalne z kruszyn.com
        id: intencje
        if: github.event.schedule != '7 * * * *'   # intencje zmieniają się raz w tygodniu – godzinny przebieg pomija
        continue-on-error: true
        run: python scripts/kruszyn_intencje.py

      - name: Pobierz mecze Znicza z regiowyniki.pl
        id: znicz
        if: github.event.schedule != '7 * * * *'
        continue-on-error: true
        run: python scripts/znicz_mecze.py

      - name: Pobierz wydarzenia z arkusza Google
        id: wydarzenia
        continue-on-error: true
        run: python scripts/wydarzenia.py

      - name: Wyślij powiadomienia push (IMGW)
        id: powiadomienia
        continue-on-error: true
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PUSH_TEST: ${{ github.event.inputs.test_push }}
          PUSH_DRY_RUN: "1"   # "1" = tryb próbny (tylko log), "0" = prawdziwa wysyłka
        run: |
          if [ "$PUSH_TEST" = "true" ]; then python scripts/powiadomienia.py --test; else python scripts/powiadomienia.py; fi

      - name: Zbuduj kalendarz .ics
        run: python scripts/make_ics.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "kruszyn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html
          for f in wylaczenia.json ostrzezenia.json intencje.json znicz.json; do [ -f "$f" ] && git add "$f"; done || true
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych"
            # ktoś mógł w międzyczasie zapisać zmiany w repozytorium – dołącz je i spróbuj ponownie
            for i in 1 2 3; do
              git pull --rebase -X ours origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done || true
          fi

      - name: Przygotuj pliki strony
        run: |
          mkdir -p ../_site/kruszyn
          cp index.html wies.json favicon.svg manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png icon-maskable-512.png ../_site/kruszyn/
          cp -r data ../_site/kruszyn/data
          cp push/OneSignalSDKWorker.js ../_site/OneSignalSDKWorker.js   # OneSignal szuka workera w katalogu głównym domeny
          [ -f wylaczenia.json ] && cp wylaczenia.json ../_site/kruszyn/ || true
          [ -f ostrzezenia.json ] && cp ostrzezenia.json ../_site/kruszyn/ || true
          [ -f intencje.json ] && cp intencje.json ../_site/kruszyn/ || true
          [ -f znicz.json ] && cp znicz.json ../_site/kruszyn/ || true
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=kruszyn/"><a href="kruszyn/">Mój Kruszyn</a>' > ../_site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Zgłoś, jeśli pobieranie danych się nie udało
        if: needs.build.outputs.scrape == 'failure'
        run: |
          echo "::error::Nie udało się pobrać terminów z com-d.pl. Strona działa na ostatnich dobrych danych."
          exit 1

      - name: Ostrzeżenie o danych o prądzie
        if: needs.build.outputs.prad == 'failure'
        run: echo "::warning::Nie udało się pobrać wyłączeń prądu z Tauron. Aplikacja pokazuje ostatnie dane."

      - name: Ostrzeżenie o danych IMGW
        if: needs.build.outputs.imgw == 'failure'
        run: echo "::warning::Nie udało się pobrać ostrzeżeń IMGW. Aplikacja pokazuje ostatnie dane."

      - name: Ostrzeżenie o intencjach mszalnych
        if: needs.build.outputs.intencje == 'failure'
        run: echo "::warning::Nie udało się pobrać intencji mszalnych z kruszyn.com. Aplikacja pokazuje ostatnie dane."

      - name: Ostrzeżenie o danych Znicza
        if: needs.build.outputs.znicz == 'failure'
        run: echo "::warning::Nie udało się pobrać meczów Znicza z regiowyniki.pl. Aplikacja pokazuje ostatnie dane."

      - name: Ostrzeżenie o wydarzeniach
        if: needs.build.outputs.wydarzenia == 'failure'
        run: echo "::warning::Nie udało się pobrać wydarzeń z arkusza Google. Aplikacja pokazuje ostatnie dane."

      - name: Ostrzeżenie o powiadomieniach push
        if: needs.build.outputs.powiadomienia == 'failure'
        run: echo "::warning::Nie udało się wysłać powiadomień push. Sprawdź log kroku w zadaniu build."
