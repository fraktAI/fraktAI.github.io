name: Wyłączenia prądu (Tauron)

on:
  schedule:
    - cron: "17 * * * *"      # co godzinę
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: tauron
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz dane z Tauron
        env:
          TAURON_CITY_GAID: ${{ vars.TAURON_CITY_GAID }}
          TAURON_STREET_GAIDS: ${{ vars.TAURON_STREET_GAIDS }}
        run: python scripts/tauron.py
      - name: Zapisz zmiany
        run: |
          git config user.name "tauron-bot"
          git config user.email "tauron-bot@users.noreply.github.com"
          git add wylaczenia.json
          git diff --cached --quiet || (git commit -m "Aktualizacja wyłączeń prądu (Tauron)" && git push)
