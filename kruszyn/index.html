<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kruszyn – informator</title>
<style>
:root{
  --bg:#f5f6f2;--card:#fff;--ink:#1c221e;--mute:#5a655e;--line:#e1e5df;--accent:#2f6b3f;--soft:#eef2ec;
  --c-zmieszane:#55605a;--c-bio:#8a5a2b;--c-plastik:#d9a400;--c-szklo:#2e8b57;
  --c-makulatura:#2f6fb5;--c-odziez:#9b4f9b;--c-gabaryty:#d1621f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121513;--card:#1a1f1c;--ink:#e8ece9;--mute:#9aa7a0;--line:#2a312d;--accent:#7cc38c;--soft:#222925;
  --c-zmieszane:#9aa5a0;--c-bio:#c99562;--c-plastik:#f0c43a;--c-szklo:#5fc08a;
  --c-makulatura:#6aa5e6;--c-odziez:#c98bc9;--c-gabaryty:#f08c4d;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header h1{margin:8px 0 0;font-size:28px;letter-spacing:-.01em}
header p{margin:2px 0;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin-top:14px}
.card h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
#alert{margin-top:14px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600}
@media (prefers-color-scheme:dark){#alert{color:#0c140e}}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c)}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.sub{font-size:13px;color:var(--mute)}
.when{text-align:right;white-space:nowrap}
.when b{display:block}
.soon{color:var(--accent)}
a{color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:18px}
.nav button:disabled{opacity:.35}
.nav strong{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dow{font-size:11px;color:var(--mute);text-align:center;padding:2px 0}
.day{border:1px solid transparent;background:var(--soft);color:var(--ink);border-radius:9px;min-height:46px;padding:4px 2px;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day.empty{background:none;border:0;visibility:hidden}
.day.past{opacity:.45}
.day.today{border-color:var(--accent)}
.day.sel{outline:2px solid var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
#detail{font-size:14px;margin:0 0 10px;color:var(--mute);min-height:20px}

.wnow{display:flex;align-items:center;gap:14px;padding:4px 0 12px}
.wnow .ico{font-size:46px;line-height:1}
.wnow .t{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:10px 0;border-top:1px solid var(--line);text-align:center;font-size:13px}
.hours div span{display:block;color:var(--mute);font-size:12px}
.hours div b{display:block;font-size:15px}
.drow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.drow .d{width:64px;font-weight:600;text-transform:capitalize}
.drow .i{font-size:22px;width:28px;text-align:center}
.drow .mm{flex:1;color:var(--mute);font-size:13px}
.drow .tt{white-space:nowrap}
.drow .tt span{color:var(--mute)}
.wwarn{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 10px}
footer{margin-top:18px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Kruszyn</h1>
    <p>gmina Bolesławiec · woj. dolnośląskie</p>
    <p id="today"></p>
  </header>
  <div id="alert" hidden></div>
  <section class="card" id="weather"><h2>Pogoda</h2><div id="wbody" class="sub" style="padding-bottom:10px">Ładowanie…</div></section>
  <section class="card"><h2>Wywóz śmieci</h2><ul id="list"></ul></section>
  <section class="card">
    <h2>Kalendarz odbiorów</h2>
    <div class="nav"><button id="prev" aria-label="Poprzedni miesiąc">‹</button><strong id="mname"></strong><button id="next" aria-label="Następny miesiąc">›</button></div>
    <div class="grid" id="grid"></div>
    <p id="detail"></p>
  </section>
  <footer id="foot"></footer>
</main>
<script>
const FALLBACK = /*WASTE_DATA_START*/{"village": "Kruszyn", "commune": "Gmina Bolesławiec", "source": "http://www.com-d.pl/komunalne/harm/boleslawiec-2026r-gmina/kruszyn", "mode": "pdf", "fetched": "2026-11-15", "phone": "76 870 21 68", "fractions": [{"id": "zmieszane", "label": "Odpady zmieszane", "frequency": "Co dwa tygodnie (nieparzyste)", "dates": ["2026-01-12", "2026-01-26", "2026-02-09", "2026-02-23", "2026-03-09", "2026-03-23", "2026-04-02", "2026-04-20", "2026-05-04", "2026-05-18", "2026-06-01", "2026-06-15", "2026-06-29", "2026-07-13", "2026-07-27", "2026-08-10", "2026-08-24", "2026-09-07", "2026-09-21", "2026-10-05", "2026-10-19", "2026-11-02", "2026-11-16", "2026-11-30", "2026-12-14", "2026-12-28"]}, {"id": "bio", "label": "Bioodpady", "frequency": "Co dwa tygodnie (parzyste)", "dates": ["2026-01-05", "2026-01-19", "2026-02-02", "2026-02-16", "2026-03-02", "2026-03-16", "2026-03-30", "2026-04-13", "2026-04-27", "2026-05-11", "2026-05-25", "2026-06-08", "2026-06-22", "2026-07-06", "2026-07-20", "2026-08-03", "2026-08-17", "2026-08-31", "2026-09-14", "2026-09-28", "2026-10-12", "2026-10-26", "2026-11-09", "2026-11-23", "2026-12-07", "2026-12-21"]}, {"id": "plastik", "label": "Plastik", "frequency": "Co 4 tygodnie", "dates": ["2026-01-05", "2026-02-02", "2026-03-02", "2026-03-30", "2026-04-27", "2026-05-25", "2026-06-22", "2026-07-20", "2026-08-17", "2026-09-14", "2026-10-12", "2026-11-09", "2026-12-07"]}, {"id": "szklo", "label": "Szkło", "frequency": "Co 8 tygodni", "dates": ["2026-01-19", "2026-03-16", "2026-05-11", "2026-07-06", "2026-08-31", "2026-10-26", "2026-12-21"]}, {"id": "makulatura", "label": "Makulatura", "frequency": "Co 8 tygodni", "dates": ["2026-02-16", "2026-04-13", "2026-06-08", "2026-08-03", "2026-09-28", "2026-11-23"]}, {"id": "odziez", "label": "Odzież i tekstylia", "frequency": "odzież i tekstylia 2x w roku", "dates": ["2026-03-02", "2026-11-16"]}, {"id": "gabaryty", "label": "Gabaryty, RTV, opony", "frequency": "WGB, RTV, OPONY 2x w roku", "dates": ["2026-03-07", "2026-08-01"]}]}/*WASTE_DATA_END*/;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fmt = (s, o) => new Intl.DateTimeFormat('pl-PL', {timeZone: 'UTC', ...o}).format(new Date(utc(s)));

async function load() {
  try {
    const r = await fetch('waste.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { return FALLBACK; }
}

(async function () {
  const data = await load();
  if (!data) { document.getElementById('list').innerHTML = '<li class="sub">Brak danych o wywozie.</li>'; return; }

  const now = new Date();
  const today = iso(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const diff = s => Math.round((utc(s) - utc(today)) / 864e5);
  const rel = n => n === 0 ? 'dziś' : n === 1 ? 'jutro' : `za ${n} dni`;
  const col = id => `style="--c:var(--c-${esc(id)})"`;
  const fr = data.fractions;

  document.getElementById('today').textContent =
    fmt(today, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});

  // --- alert: dziś / jutro ---
  const names = n => fr.filter(f => f.dates.some(d => diff(d) === n)).map(f => f.label);
  const t0 = names(0), t1 = names(1), al = document.getElementById('alert');
  const parts = [];
  if (t0.length) parts.push('Dziś odbiór: ' + t0.join(', '));
  if (t1.length) parts.push('Jutro odbiór: ' + t1.join(', '));
  if (parts.length) { al.textContent = parts.join(' · '); al.hidden = false; }

  // --- lista frakcji ---
  const next = f => f.dates.find(d => diff(d) >= 0) || null;
  const rows = fr.map(f => ({f, n: next(f)})).sort((a, b) =>
    (a.n ? utc(a.n) : Infinity) - (b.n ? utc(b.n) : Infinity));
  document.getElementById('list').innerHTML = rows.map(({f, n}) => {
    let right;
    if (n) {
      const k = diff(n);
      right = `<div class="when"><b class="${k <= 1 ? 'soon' : ''}">${esc(fmt(n, {weekday: 'short', day: 'numeric', month: 'short'}))}</b><span class="sub">${rel(k)}</span></div>`;
    } else if (f.dates.length) {
      right = `<div class="when sub">brak kolejnego terminu<br><a href="tel:${esc(data.phone.replace(/\s/g, ''))}">${esc(data.phone)}</a></div>`;
    } else {
      right = `<div class="when sub">brak terminu<br><a href="tel:${esc(f.contact.replace(/\s/g, ''))}">${esc(f.contact)}</a></div>`;
    }
    return `<li class="row" ${col(f.id)}><span class="dot"></span><div class="grow"><div class="name">${esc(f.label)}</div><div class="sub">${esc(f.frequency)}</div></div>${right}</li>`;
  }).join('');

  // --- kalendarz ---
  const byDate = {};
  fr.forEach(f => f.dates.forEach(d => (byDate[d] = byDate[d] || []).push(f)));
  const all = Object.keys(byDate).sort();
  const [ty, tm] = today.split('-').map(Number);
  const last = all.length ? all[all.length - 1].split('-').map(Number) : [ty, tm];
  const minI = ty * 12 + tm - 1, maxI = Math.max(minI, last[0] * 12 + last[1] - 1);
  let cur = minI, sel = today;

  const grid = document.getElementById('grid'), detail = document.getElementById('detail');
  function showDetail(d) {
    const list = byDate[d] || [];
    detail.textContent = fmt(d, {weekday: 'long', day: 'numeric', month: 'long'}) + ': ' +
      (list.length ? list.map(f => f.label).join(', ') : 'brak odbiorów');
  }
  function draw() {
    const y = Math.floor(cur / 12), m = cur % 12 + 1;
    document.getElementById('mname').textContent = fmt(iso(y, m, 1), {month: 'long', year: 'numeric'});
    document.getElementById('prev').disabled = cur <= minI;
    document.getElementById('next').disabled = cur >= maxI;
    const first = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
    const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let h = ['pn', 'wt', 'śr', 'cz', 'pt', 'so', 'nd'].map(x => `<div class="dow">${x}</div>`).join('');
    for (let i = 0; i < first; i++) h += '<div class="day empty"></div>';
    for (let d = 1; d <= dim; d++) {
      const s = iso(y, m, d), l = byDate[s] || [];
      const cls = ['day', diff(s) < 0 ? 'past' : '', s === today ? 'today' : '', s === sel ? 'sel' : ''].join(' ');
      h += `<button class="${cls}" data-d="${s}" aria-label="${esc(d + ': ' + (l.map(f => f.label).join(', ') || 'brak odbiorów'))}">${d}<span class="dots">${l.map(f => `<i ${col(f.id)}></i>`).join('')}</span></button>`;
    }
    grid.innerHTML = h;
    showDetail(sel);
  }
  grid.addEventListener('click', e => {
    const b = e.target.closest('.day[data-d]'); if (!b) return;
    sel = b.dataset.d; draw();
  });
  document.getElementById('prev').onclick = () => { cur--; draw(); };
  document.getElementById('next').onclick = () => { cur++; draw(); };
  draw();

  // --- stopka ---
  const src = data.mode === 'pdf' ? 'kalendarz PDF COM-D z ' : data.mode === 'seed' ? 'odczyt ręczny ' : 'pobrano ';
  document.getElementById('foot').innerHTML =
    `Źródło: <a href="${esc(data.source)}">COM-D (com-d.pl)</a> · ${src}${esc(String(data.fetched).slice(0, 10))}.<br>` +
    `Terminy mogą ulec zmianie – w razie wątpliwości zadzwoń: <a href="tel:${esc(data.phone.replace(/\s/g, ''))}">${esc(data.phone)}</a>.`;
})();

// ---------- POGODA (Open-Meteo, bez klucza) ----------
(async function () {
  const LAT = 51.2604, LON = 15.6163, KEY = 'kruszyn-weather';
  const URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,precipitation' +
    '&hourly=temperature_2m,precipitation_probability,weather_code' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max' +
    '&timezone=Europe%2FWarsaw&forecast_days=5';
  const WMO = c => c === 0 ? ['Bezchmurnie', '☀️'] : c === 1 ? ['Prawie bezchmurnie', '🌤️'] : c === 2 ? ['Częściowe zachmurzenie', '⛅'] :
    c === 3 ? ['Pochmurno', '☁️'] : c <= 48 ? ['Mgła', '🌫️'] : c <= 55 ? ['Mżawka', '🌦️'] : c <= 57 ? ['Marznąca mżawka', '🌧️'] :
    c <= 65 ? ['Deszcz', '🌧️'] : c <= 67 ? ['Marznący deszcz', '🌧️'] : c <= 75 ? ['Śnieg', '🌨️'] : c === 77 ? ['Ziarna śnieżne', '🌨️'] :
    c <= 82 ? ['Przelotny deszcz', '🌦️'] : c <= 86 ? ['Przelotny śnieg', '🌨️'] : c === 95 ? ['Burza', '⛈️'] : ['Burza z gradem', '⛈️'];
  const e = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const r = x => Math.round(x);
  const box = document.getElementById('wbody');

  async function get() {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 10000);
      const res = await fetch(URL, {signal: ctl.signal}); clearTimeout(to);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      try { localStorage.setItem(KEY, JSON.stringify({t: Date.now(), data})); } catch (_) {}
      return {data, age: 0};
    } catch (_) {
      try { const c = JSON.parse(localStorage.getItem(KEY)); if (c) return {data: c.data, age: Date.now() - c.t}; } catch (_) {}
      return null;
    }
  }

  const got = await get();
  if (!got) { box.textContent = 'Nie udało się pobrać pogody. Sprawdź połączenie z internetem.'; return; }
  const {data: w, age} = got, c = w.current, d = w.daily, hr = w.hourly;
  const [txt, ico] = WMO(c.weather_code);

  let html = `<div class="wnow"><span class="ico">${ico}</span><div><div class="t">${r(c.temperature_2m)}°C</div>
    <div>${e(txt)}</div><div class="sub">odczuwalna ${r(c.apparent_temperature)}° · wiatr ${r(c.wind_speed_10m)} km/h, porywy ${r(c.wind_gusts_10m)}</div></div></div>`;

  const warn = [];
  [0, 1].forEach(i => {
    const when = i ? 'jutro' : 'dziś';
    if (d.wind_gusts_10m_max[i] >= 60) warn.push(`${when}: silne porywy wiatru do ${r(d.wind_gusts_10m_max[i])} km/h`);
    if (d.weather_code[i] >= 95) warn.push(`${when}: możliwa burza`);
    if (d.temperature_2m_min[i] <= 0) warn.push(`${when}: przymrozek (min ${r(d.temperature_2m_min[i])}°C)`);
  });
  if (warn.length) html += `<div class="wwarn">⚠️ ${e(warn.join(' · '))}</div>`;

  const start = Math.max(0, hr.time.findIndex(t => t >= c.time.slice(0, 13)));
  let hh = '';
  for (let k = 0; k < 6; k++) {
    const i = start + k * 2; if (i >= hr.time.length) break;
    hh += `<div><span>${hr.time[i].slice(11, 16)}</span><b>${r(hr.temperature_2m[i])}°</b><span>${WMO(hr.weather_code[i])[1]} ${hr.precipitation_probability[i] ?? 0}%</span></div>`;
  }
  html += `<div class="hours">${hh}</div>`;

  html += d.time.map((s, i) => {
    const dn = i === 0 ? 'dziś' : i === 1 ? 'jutro' : new Intl.DateTimeFormat('pl-PL', {timeZone: 'UTC', weekday: 'short'}).format(new Date(s + 'T00:00:00Z'));
    const mm = d.precipitation_sum[i] >= 0.1 ? `${d.precipitation_sum[i].toFixed(1).replace('.', ',')} mm · ${d.precipitation_probability_max[i] ?? 0}%` : 'bez opadów';
    return `<div class="drow"><span class="d">${e(dn)}</span><span class="i">${WMO(d.weather_code[i])[1]}</span><span class="mm">${mm}</span><span class="tt"><b>${r(d.temperature_2m_max[i])}°</b> <span>${r(d.temperature_2m_min[i])}°</span></span></div>`;
  }).join('');

  if (age > 6e5) html += `<p class="sub" style="margin:8px 0">Brak połączenia – dane sprzed ${Math.round(age / 6e4)} min.</p>`;
  else html += `<p class="sub" style="margin:8px 0 6px">Dane: Open-Meteo.com</p>`;
  box.innerHTML = html; box.classList.remove('sub'); box.style.paddingBottom = '0';
})();
</script>
</body>
</html>
